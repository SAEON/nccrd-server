name: CI

on: [ push, pull_request ]

jobs:
  schema-check:
    # Catches schema drift: a model changed without a matching migration
    # being written, or a migration that doesn't actually apply cleanly to
    # a fresh database. Runs `alembic upgrade head` then `alembic check` —
    # the latter fails if the resulting schema doesn't match the current
    # ORM models (a few known model-less tables/indexes are excluded from
    # the comparison in alembic/env.py — see its comments).
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: nccrd_schema_check
          POSTGRES_USER: nccrd_user
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NCCRD_DB_HOST: localhost
      NCCRD_DB_PORT: 5432
      NCCRD_DB_NAME: nccrd_schema_check
      NCCRD_DB_USER: nccrd_user
      NCCRD_DB_PASS: pass
      NCCRD_JWT_SECRET: schema-check-not-for-production

    steps:
      - name: Check out nccrd-server
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-sync

      - name: Migrate a fresh database to head
        run: alembic upgrade head

      - name: Check for schema drift
        run: alembic check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out nccrd-server
        uses: actions/checkout@v4
        with:
          path: nccrd-server

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: nccrd-server
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-sync requirements.txt requirements-dev.txt  # the app's dependencies plus the test tools
          
      - name: Set up testing environment
        working-directory: nccrd-server/test
        shell: bash
        run: |
          cp .env.test .env
          docker compose up -d
          sleep 30s

      - name: Run the tests
        working-directory: nccrd-server/test
        run: |
          coverage run -m pytest
          coverage xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: nccrd-server/test
          token: ${{ secrets.CODECOV_TOKEN }}
